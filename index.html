
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog do Professor Marcelo e [Seu Nome Aqui]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #fff;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 20px;
        }

        img {
            width: 80px;
            height: 80px;
            margin-right: 20px;
        }

        .artigo-autor {
            font-weight: bold;
        }

        button {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <header>
        <h1>Blog do Professor Marcelo e [Seu Nome Aqui]</h1>
        <p>Vou compartilhar sobre desenvolvimento web, programação e muito mais!</p>
    </header>
    <main>
        <article>
            <img src="imagem-blog.png" alt="Descrição curta da imagem no máximo 2 linhas.">
            <div>
                <h2>Título do 1º post</h2>
                <p class="artigo-autor">Por: [Seu Nome Aqui]</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar sobre...</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
        <article>
            <img src="imagem-blog.png" alt="Descrição curta da imagem no máximo 2 linhas.">
            <div>
                <h2>Título do 2º post</h2>
                <p class="artigo-autor">Por: [Seu Nome Aqui]</p>
                <p>Escrita do 2º post.</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false) {
                texto.textContent++;
                curtiu = true;
            } else {
                texto.textContent--;
                curtiu = false;
            }
        }
    })
</script>

</html>
